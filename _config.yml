# JWOC 2026 initial template
# --- Site basics ---
title: "Junior Conference on Wireless and Optical Communications (JWOC)"
description: "JWOC 2026, the 8th Junior Conference on Wireless and Optical Communications, held on 2 October 2026 at Télécom Paris."
url: "https://lemonstudy.github.io"   # Update if the 2026 site moves to a custom domain or organization site
baseurl: "/jwoc-2026.github.io"       # GitHub Pages project site path

# --- Theme & plugins (GitHub Pages compatible) ---
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# --- Markdown / code ---
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  auto_ids: true

# --- Build flags (GitHub Pages ignores some of these anyway) ---
# safe is forced to true on GitHub Pages; no need to set it.
# 'source' should NOT be set to a placeholder; remove it.
lsi: false
incremental: false
